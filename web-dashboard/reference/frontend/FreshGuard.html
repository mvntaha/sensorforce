function inventoryPanel(full=false){return `<section class="panel"><div class="panel-head inventory-head"><div><h2>${full?'Your food inventory':'Your food, at a glance'}</h2><p class="sub">Know what you have. Use what matters first.</p></div><button class="text-btn" ${full?'data-action="lookup"':'data-go="inventory"'}>${full?icon('qr')+' Find by container ID':'View inventory '+icon('arrow')}</button></div><div class="filters">${['All items','Fresh/Normal','Use Soon','Check Food'].map(f=>`<button data-filter="${f}" class="chip ${filter===f?'active':''}">${f==='Fresh/Normal'?'Fresh':f}</button>`).join('')}<div class="search">${icon('search')}<input id="search" placeholder="Search food items…" aria-label="Search food items" value="${esc(query)}"></div></div><div id="inventory-table">${table()}</div></section>`}
const safety=()=>`<div class="safety">${icon('shield')} FreshGuard monitors storage conditions, not food safety. Always inspect food and follow product labels. All sensor readings and thresholds in this demo are simulated assumptions.</div>`;
function render(){renderNav();let h='';if(page==='overview'){h=heading('A fresher kitchen starts here.','Keep an eye on your food. A little care makes a big difference.',`<button data-action="export">${icon('download')} Export report</button>${addButton()}`)+`<section class="welcome"><div><div class="eyebrow">LESS WASTE. MORE GOOD.</div><h2>Good food deserves a little care.</h2><p>You have ${state.items.filter(i=>status(i)==='Use Soon').length} items to use soon. Plan your next meal around them<br>and turn a small reminder into a positive impact.</p></div>${artwork()}</section>`+stats()+`<div class="grid-two">${sensorPanel()}${alertsPanel()}</div>`+inventoryPanel()+safety()}
if(page==='inventory')h=heading('Food inventory','Every container has a story. Keep yours fresh.',`<button data-action="lookup">${icon('qr')} Scan / find item</button>${addButton()}`)+stats()+inventoryPanel(true)+safety();
if(page==='alerts')h=heading('Alerts & notifications','Review conditions, take action, and stay one step ahead.',`<button data-action="ack-all">${icon('check')} Acknowledge all</button>`)+`<div class="note">Dashboard alerts are functional. Email, app push, physical buzzers, LEDs and LCD output require a controller and approved notification backend. Acknowledging does not clear the underlying condition.</div><div class="grid-two"><section class="panel"><div class="panel-head"><h2>Needs your attention · ${activeAlerts().length}</h2><button class="text-btn" data-action="restore-alerts">Show acknowledged</button></div><div class="alert-list">${activeAlerts().map(a=>alertCard(a,true)).join('')||'<div class="empty">No unacknowledged alerts.</div>'}</div></section><section class="panel"><div class="panel-head"><h2>Activity log</h2></div><div class="settings-body log">${state.events.slice(0,35).map(e=>`<div>${esc(new Date(e.time).toLocaleTimeString())} · ${esc(e.message)} ${e.synced?'':'[queued]'}</div>`).join('')||'No events yet.'}</div></section></div>`;
if(page==='sensors')h=heading('Sensors & devices','Explore the monitoring flow with controlled, simulated inputs.',`<button data-action="network">${icon('sensor')} ${state.offline?'Restore demo connection':'Simulate network loss'}</button>`)+`<div class="note">ESP32 architecture preview · No controller is connected. These controls simulate zone readings, fault handling, door timers and a browser-local event queue. ${state.offline?'Demo connection offline — new events are queued.':'Demo connection online.'} Browser simulation is not a physical IoT test.</div><div class="simulation">${sensorPanel()}<section class="panel sim-card"><h2>Sensor simulator</h2><p class="sub">Apply a reading to ${esc(zone)}. Gas is a relative raw reading, not calibrated ppm.</p><form id="sensor-form"><div class="form-grid"><label>Temperature (°C)<input type="number" step="0.1" name="temp" min="-40" max="80" required value="${state.zones[zone].temp}"></label><label>Humidity (%)<input type="number" name="humidity" min="0" max="100" required value="${state.zones[zone].humidity}"></label><label>Gas reading (raw ADC)<input type="number" name="gas" min="0" max="4095" required value="${state.zones[zone].gas}"></label><label>Door state<select name="door"><option value="closed">Closed</option><option value="open" ${state.zones[zone].door?'selected':''}>Open</option></select></label></div><div class="form-foot"><button class="primary">Apply simulated reading</button></div></form><div class="scenario-buttons"><button data-scenario="normal">Normal</button><button data-scenario="heat">High temperature</button><button data-scenario="humidity">High humidity</button><button data-scenario="gas">Abnormal gas</button><button data-scenario="fault">Sensor fault</button></div><div class="lcd">SIMULATED LCD / LOCAL OUTPUT<br>${state.zones[zone].fault?'Sensor Fault/Data Unavailable':`T: ${state.zones[zone].temp} C | RH: ${state.zones[zone].humidity}%<br>GAS: ${state.zones[zone].gas} RAW | DOOR: ${state.zones[zone].door?'OPEN':'CLOSED'}`}<br>${alerts().some(a=>a.level==='red')?'RED · CHECK CONDITION':'GREEN / YELLOW · SEE ITEM STATUS'}</div><p class="sub">Buffered events: ${state.events.filter(e=>!e.synced).length} · Reconnect marks each unique event once in the local demo store. No remote synchronization occurs.</p></section></div>`+safety();
if(page==='planner'){let items=[...state.items].sort((a,b)=>daysLeft(a)-daysLeft(b));h=heading('Make the most of what’s fresh.','Your consumption plan, ordered by the earliest configured limit.')+`<div class="note">Inspect “Check Food” items before use. Recording consumption is your decision, not a food-safety recommendation.</div><section class="panel"><div class="panel-head"><h2>Use-first plan</h2><span class="sub">${items.length} items in your kitchen</span></div>${items.map(i=>`<div class="plan-item"><span class="food-emoji">${i.emoji}</span><div><h3>${esc(i.name)}</h3><p>${esc(i.quantity)} · ${daysLeft(i)<0?'Inspect — configured limit exceeded':`Use within ${daysLeft(i)} day(s)`}</p>${badge(status(i))}</div><div class="actions"><button data-action="consume" data-id="${i.id}">${icon('check')} Mark consumed</button><button data-action="discard" data-id="${i.id}">Record disposal</button></div></div>`).join('')||'<div class="empty">Your inventory is empty. Add an item to start planning.</div>'}</section>`+safety()}
if(page==='reports')h=heading('A little insight. A bigger impact.','Real summaries of your current browser-demo inventory.',`<button data-action="export">${icon('download')} Export CSV report</button><button data-action="backup">Download backup</button>`)+stats()+`<div class="grid-two"><section class="panel sim-card"><h2>Inventory by category</h2><p class="sub">Current registered items</p><br>${categories.map(c=>{let n=state.items.filter(i=>i.category===c).length;return `<div class="report-row"><span>${c}</span><strong>${n} items</strong></div><div class="report-bar"><span style="width:${n/Math.max(1,state.items.length)*100}%"></span></div>`}).join('')}</section><section class="panel sim-card"><h2>Your food-management activity</h2><div class="big-number">${state.consumed}<small style="font-size:14px;letter-spacing:0"> consumed</small></div><p class="sub">${state.discarded} item(s) recorded as disposed.<br>${state.history.length} simulated sensor snapshots stored.<br>${state.events.length} logged events.</p><div class="note" style="margin-top:24px">No estimated CO₂ or money saved is displayed: this prototype has no measured weight, price or verified environmental data.</div></section></div>`;
if(page==='settings')h=heading('Settings & thresholds','Configure your prototype. Make the assumptions explicit.')+`<div class="note">Administrator controls in a single-user demo, not authenticated access. These values are controlled demo assumptions, not certified food-storage guidance. Production needs secure authentication, server validation, TLS, calibrated sensors and hardware testing.</div><section class="panel"><div class="panel-head"><h2>Freshness decision thresholds</h2><span class="badge">Demo configuration</span></div><form id="settings-form" class="settings-body"><div class="form-grid">${[['tempMin','Minimum temperature (°C)',-40,80],['tempMax','Maximum temperature (°C)',-40,80],['humidityMin','Minimum humidity (%)',0,100],['humidityMax','Maximum humidity (%)',0,100],['gas','Abnormal gas threshold (raw)',0,4095],['door','Door-open timeout (seconds)',1,3600],['soon','Use-soon window (days)',0,30]].map(([k,l,min,max])=>`<label>${l}<input required type="number" step="${k.startsWith('temp')?'.1':'1'}" min="${min}" max="${max}" name="${k}" value="${state.thresholds[k]}"></label>`).join('')}</div><h2 style="margin:25px 0 18px">Default storage duration by category</h2><div class="form-grid">${categories.map((c,i)=>`<label>${c} (days)<input name="category${i}" required type="number" min="1" max="365" value="${state.categoryLimits[c]}"></label>`).join('')}</div><p class="sub" style="margin-top:18px">Category limits apply to new items. Existing item limits can be edited individually. Environment limits are shared by both simulated zones.</p><div class="form-foot"><button type="button" data-action="reset" class="danger">Reset demo data</button><button class="primary">Save configuration</button></div></form></section><section class="panel" style="margin-top:22px"><div class="panel-head"><h2>Decision rule order</h2></div><div class="settings-body sub">1. Required data missing → Sensor Fault/Data Unavailable.<br>2. Environmental threshold or item time limit exceeded → Check Food.<br>3. Expiry or duration limit approaches → Use Soon.<br>4. Otherwise → Fresh/Normal (not a food-safety certification).<br>Door warnings are storage alerts. Shared gas readings never identify a source item.</div></section>`;
$('#main').innerHTML=h;bind();}
function bind(){ $$('[data-go]').forEach(b=>b.onclick=()=>location.hash=b.dataset.go);$$('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id));$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});if($('#search'))$('#search').oninput=e=>{query=e.target.value;$('#inventory-table').innerHTML=table();$$('[data-action]', $('#inventory-table')).forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset.id))};if($('#zone-select'))$('#zone-select').onchange=e=>{zone=e.target.value;render()};if($('#metric'))$('#metric').onchange=e=>{chartMetric=e.target.value;render()};$$('[data-scenario]').forEach(b=>b.onclick=()=>{let s=state.zones[zone];Object.assign(s,{temp:3.8,humidity:64,gas:182,fault:false});({heat:()=>s.temp=10,humidity:()=>s.humidity=96,gas:()=>s.gas=580,fault:()=>s.fault=true,normal:()=>{s.door=false;s.doorSince=null}})[b.dataset.scenario]();event('reading',`${zone}: ${b.dataset.scenario} scenario`);record();render();toast('Simulated condition applied')});if($('#sensor-form'))$('#sensor-form').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),s=state.zones[zone],open=d.get('door')==='open';Object.assign(s,{temp:+d.get('temp'),humidity:+d.get('humidity'),gas:+d.get('gas'),fault:false,door:open,doorSince:open?(s.doorSince||Date.now()):null});event('reading','Simulated reading applied to '+zone);record();render();toast('Reading applied')};if($('#settings-form'))$('#settings-form').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),t={};Object.keys(state.thresholds).forEach(k=>t[k]=+d.get(k));if(t.tempMin>=t.tempMax||t.humidityMin>=t.humidityMax)return toast('Minimum values must be lower than maximum values.');state.thresholds=t;categories.forEach((c,i)=>state.categoryLimits[c]=+d.get('category'+i));event('settings','Threshold configuration updated');render();toast('Configuration saved')};}
function openModal(content){$('#modal-content').innerHTML=content;$('#modal').showModal();$$('[data-close]',$('#modal')).forEach(b=>b.onclick=()=>$('#modal').close())}
function foodForm(id){let item=state.items.find(i=>i.id===id),i=item||{name:'',category:'Dairy',quantity:'',zone,stored:today(),manufactured:'',expiry:'',limit:state.categoryLimits.Dairy};openModal(`<div class="modal-head"><h2>${item?'Edit food item':'Add a little freshness'}</h2><button data-close aria-label="Close">×</button></div><form id="food-form"><div class="form-grid"><label class="span-2">Food name<input name="name" required maxlength="80" placeholder="e.g. Organic milk" value="${esc(i.name)}"></label><label>Category<select name="category">${categories.map(c=>`<option ${i.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Quantity<input name="quantity" maxlength="40" required placeholder="e.g. 1 litre" value="${esc(i.quantity)}"></label><label>Storage location<select name="zone">${Object.keys(state.zones).map(z=>`<option ${i.zone===z?'selected':''}>${z}</option>`).join('')}</select></label><label>Manufactured on (optional)<input type="date" name="manufactured" max="${today()}" value="${i.manufactured}"></label><label>Storage date<input type="date" name="stored" required max="${today()}" value="${i.stored}"></label><label>Expiry / best-before (optional)<input type="date" name="expiry" value="${i.expiry}"></label><label>Storage-duration limit (days)<input name="limit" type="number" min="1" max="365" required value="${i.limit}"></label></div><p class="sub" style="margin-top:18px">A unique container ID is assigned automatically. The earliest expiry or storage-duration limit is used.</p><div class="form-foot"><button type="button" data-close>Cancel</button><button class="primary">${item?'Save changes':'Add food item'}</button></div></form>`);$('#food-form [name=category]').onchange=e=>$('#food-form [name=limit]').value=state.categoryLimits[e.target.value];$('#food-form').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(v.manufactured&&v.manufactured>v.stored)return toast('Manufacture date cannot be after storage date.');if(v.expiry&&v.expiry<v.stored)return toast('Expiry cannot be earlier than storage date.');if(!v.name.trim()||!v.quantity.trim())return toast('Enter a food name and quantity.');v.name=v.name.trim();v.quantity=v.quantity.trim();v.limit=+v.limit;v.emoji={Dairy:'🥛',Vegetables:'🥦',Fruit:'🍓','Meat & seafood':'🍗','Prepared food':'🥘'}[v.category];v.id=item?item.id:'FG-'+crypto.randomUUID().slice(0,8).toUpperCase();if(item)Object.assign(item,v);else state.items.push(v);event('inventory',(item?'Updated ':'Registered ')+v.name);$('#modal').close();render();toast(item?'Food item updated':'Food item added')};}
function download(name,text,type='text/csv'){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function csvCell(v){let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function action(a,id){if(a==='add')return foodForm();if(a==='export'){const rows=[['ID','Name','Category','Quantity','Location','Manufactured','Stored','Expiry','Duration limit days','Freshness','Data source'],...state.items.map(i=>[i.id,i.name,i.category,i.quantity,i.zone,i.manufactured,i.stored,i.expiry,i.limit,status(i),'Browser simulation'])];download('FreshGuard-inventory-'+today()+'.csv',rows.map(r=>r.map(csvCell).join(',')).join('\r\n'));toast('Inventory report exported');return}if(a==='backup'){download('FreshGuard-backup.json',JSON.stringify(state,null,2),'application/json');toast('Demo backup downloaded');return}if(a==='details'){let i=state.items.find(i=>i.id===id);if(!i)return;openModal(`<div class="modal-head"><h2>${i.emoji} ${esc(i.name)}</h2><button data-close aria-label="Close">×</button></div>${badge(status(i))}<p class="sub" style="margin:20px 0">Container ID: <strong>${esc(i.id)}</strong><br>Category: ${esc(i.category)} · ${esc(i.quantity)}<br>Location: ${esc(i.zone)}<br>Manufactured: ${esc(i.manufactured||'Not provided')}<br>Stored: ${i.stored}<br>Expiry: ${i.expiry||'Not provided'} · Duration limit: ${i.limit} days</p><div class="note">${status(i)==='Fresh/Normal'?'Monitored conditions are within configured demo ranges. This is not a food-safety guarantee.':'Review the storage conditions and inspect the food before use.'}</div><div class="form-foot"><button id="delete-food" class="danger">Remove</button><button id="label-food">Container label</button><button id="edit-food" class="primary">Edit item</button></div>`);$('#edit-food').onclick=()=>{$('#modal').close();foodForm(id)};$('#delete-food').onclick=()=>{if(confirm('Remove this food item from inventory?')){state.items=state.items.filter(x=>x.id!==id);event('inventory','Removed '+i.name);$('#modal').close();render();toast('Item removed')}};$('#label-food').onclick=()=>{const qr=qrcode(0,'M');qr.addData(i.id);qr.make();openModal(`<div class="modal-head"><h2>Container identification</h2><button data-close>×</button></div><p>${esc(i.name)}</p><div style="text-align:center">${qr.createSvgTag({cellSize:5,margin:12,scalable:false})}</div><h1 style="font-family:monospace">${esc(i.id)}</h1><p class="sub">Use this ID in “Find by container ID”. Save the QR label and attach it to your container. QR image decoding requires a supporting browser.</p><div class="form-foot"><button id="save-qr">Download QR label</button><button id="copy-id" class="primary">Copy ID</button></div>`);$('#save-qr').onclick=()=>download(i.id+'-QR.svg',qr.createSvgTag({cellSize:8,margin:16}),'image/svg+xml');$('#copy-id').onclick=async()=>{try{await navigator.clipboard.writeText(i.id);toast('ID copied')}catch{toast('Clipboard unavailable. Select and copy the ID above.')}}};return}
if(a==='lookup'){openModal(`<div class="modal-head"><h2>Find your container</h2><button data-close>×</button></div><p class="sub">Enter the container ID, or scan a QR image containing its ID / FreshGuard JSON record.</p><form id="lookup-form"><label style="margin-top:20px">Container ID<input name="id" required placeholder="FG-001" autofocus></label><div class="form-foot"><button class="primary">Find item</button></div></form><label>Scan QR image (browser support required)<input id="qr-file" type="file" accept="image/*" capture="environment"></label><p class="sub" id="qr-message" style="margin-top:12px">${'BarcodeDetector' in window?'QR image decoding supported.':'This browser does not support native QR decoding. Use the container ID above.'}</p>`);const find=raw=>{let code=raw.trim();try{code=JSON.parse(code).id||code}catch{}let i=state.items.find(i=>i.id.toLowerCase()===String(code).toLowerCase());if(i){$('#modal').close();action('details',i.id)}else toast('Container not found. Check the ID or register the food item.')};$('#lookup-form').onsubmit=e=>{e.preventDefault();find(new FormData(e.target).get('id'))};$('#qr-file').onchange=async e=>{if(!('BarcodeDetector'in window))return toast('QR decoding unavailable in this browser. Use manual ID lookup.');try{let img=await createImageBitmap(e.target.files[0]),codes=await new BarcodeDetector({formats:['qr_code']}).detect(img);img.close();if(!codes.length)throw Error();find(codes[0].rawValue)}catch{toast('Could not decode QR image. Try manual ID lookup.')}};return}
if(a==='consume'||a==='discard'){let i=state.items.find(i=>i.id===id);if(!confirm(`${a==='consume'?'Record as consumed':'Record disposal of'} ${i.name}? This removes it from current inventory.`))return;state[a==='consume'?'consumed':'discarded']++;state.items=state.items.filter(x=>x.id!==id);event(a,i.name+' '+(a==='consume'?'consumed':'disposed'));toast('Activity recorded')}
if(a==='ack'){state.ack.push(id);event('ack','Alert acknowledged')}
if(a==='ack-all'){state.ack=[...new Set([...state.ack,...alerts().map(a=>a.id)])];event('ack','All current alerts acknowledged');toast('Alerts acknowledged')}
if(a==='restore-alerts'){state.ack=[];save();toast('Acknowledged alerts shown again')}
if(a==='network'){state.offline=!state.offline;if(!state.offline){let n=state.events.filter(e=>!e.synced).length;state.events.forEach(e=>e.synced=true);event('sync',`${n} queued events marked synchronized in local demo store`);toast(`${n} unique events synchronized locally`)}else{event('network','Simulated network unavailable');toast('Demo connection offline. Events will be queued.')}}
if(a==='reset'){if(!confirm('Reset all food items, history, thresholds and activity to demo defaults?'))return;state=defaults();zone='Main refrigerator';filter='All items';query='';record();save();toast('Demo data reset')}render();}
let lastAlertKeys=new Set();function record(){Object.entries(state.zones).forEach(([z,s])=>{if(!s.fault)state.history.push({time:new Date().toISOString(),zone:z,temp:s.temp,humidity:s.humidity,gas:s.gas})});state.history=state.history.slice(-400);let current=alerts();const currentIds=new Set(current.map(a=>a.id));state.ack=state.ack.filter(id=>currentIds.has(id));current.forEach(a=>{if(!lastAlertKeys.has(a.id))event('alert',a.title)});lastAlertKeys=currentIds;save()}
window.addEventListener('hashchange',()=>{page=navs.some(n=>n[0]===location.hash.slice(1))?location.hash.slice(1):'overview';filter='All items';query='';$('#sidebar').classList.remove('open');render();window.scrollTo(0,0)});
$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');$('#notification').onclick=()=>location.hash='alerts';$('#profile').onclick=()=>location.hash='settings';$$('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').close()});
page=navs.some(n=>n[0]===location.hash.slice(1))?location.hash.slice(1):'overview';record();render();setInterval(()=>{record();renderNav();if($('#modal').open||$('#sidebar').classList.contains('open'))return;if(page==='overview'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='SELECT')render();if(page==='sensors'){const chartEl=$('.chart');if(chartEl)chartEl.outerHTML=chart();} },5000);
</script></body></html>
